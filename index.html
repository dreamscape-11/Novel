<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<title>TIME KILLER</title>
<style>
:root{--bg:#fffaf2;--paper:#fff;--ink:#493f46;--muted:#8c8188;--pink:#ffdce5;--peach:#ffe6d3;--yellow:#fff0b8;--mint:#d9f4e8;--blue:#dcecff;--purple:#e9e0ff;--line:#f0e8e2;--accent:#f18da8;--shadow:0 8px 24px #745b4d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:780px;margin:auto;min-height:100vh;padding:0 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 14px}.brand{font-weight:900;font-size:22px;letter-spacing:-.8px}.brand span{color:#ee91aa}.sub{font-size:12px;color:var(--muted);margin-top:3px}.profile{display:flex;gap:7px;align-items:center;background:white;padding:9px 12px;border-radius:18px;box-shadow:var(--shadow);font-size:13px;font-weight:800}.hero{background:linear-gradient(120deg,#ffe4eb,#fff0d7 55%,#e5f6ed);border-radius:26px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"🎮";position:absolute;right:22px;bottom:8px;font-size:76px;opacity:.22;transform:rotate(-12deg)}.eyebrow{font-size:12px;font-weight:800;color:#b66c81}.hero h1{font-size:24px;line-height:1.3;margin:7px 0}.hero p{font-size:13px;color:#756873;margin:0;max-width:75%;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px}.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:12px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted);font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.section-head h2{font-size:17px;margin:0}.section-head small{color:var(--muted)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game-card{background:white;border:1px solid var(--line);border-radius:21px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:142px;transition:.15s}.game-card:active{transform:scale(.98)}.game-emoji{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:27px;margin-bottom:10px}.game-card b{display:block;font-size:14px}.game-card small{color:var(--muted);font-size:11px}.tag{display:inline-block;margin-top:8px;font-size:10px;background:#fff3e8;color:#a87953;border-radius:20px;padding:4px 8px}.quick{display:flex;gap:8px;overflow:auto;padding:2px 0 5px}.quick button{white-space:nowrap;background:white;border:1px solid var(--line);border-radius:15px;padding:10px 13px;font-size:12px;font-weight:700;color:var(--ink)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9ed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.nav-inner{width:min(780px,100%);display:flex;justify-content:space-around}.nav button{background:none;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center}.nav button.active{color:#e47f9d;font-weight:900}.nav .ico{font-size:20px}.screen{display:none}.screen.active{display:block}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin:12px 0}.back{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 13px;color:var(--ink);font-weight:700;margin:14px 0}.game-title{font-size:22px;font-weight:900;margin:5px 0}.muted{color:var(--muted);font-size:13px}.btn{background:#f39ab1;color:#fff;border-radius:14px;padding:11px 16px;font-weight:800;box-shadow:0 4px 10px #f39ab133}.btn.secondary{background:#fff0f3;color:#b7657e;box-shadow:none}.btn:disabled{opacity:.45}.center{text-align:center}.big{font-size:42px;font-weight:900;margin:14px}.grid2048{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#eadfd5;padding:8px;border-radius:15px;max-width:390px;margin:15px auto;touch-action:pan-y}.cell{aspect-ratio:1;background:#f8f2eb;border-radius:9px;display:grid;place-items:center;font-size:clamp(18px,6vw,27px);font-weight:900;color:#6c5b51}.v2{background:#eee4da}.v4{background:#f4d9b8}.v8{background:#ffc58f;color:white}.v16{background:#ffa979;color:white}.v32{background:#ff927f;color:white}.v64{background:#f47779;color:white}.v128,.v256,.v512{background:#eecb68;color:white}.v1024,.v2048{background:#e7b94d;color:white}.word-row{display:flex;justify-content:center;gap:6px;margin:8px}.letter{width:43px;height:46px;border:2px solid #eee3e5;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:20px}.letter.filled{background:#fff3f6;border-color:#f4b5c6}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin:10px 0;outline-color:#f3a3b7}.dungeon{background:linear-gradient(#f1eaff,#fff);border-radius:18px;padding:20px;text-align:center}.monster{font-size:70px}.bar{height:12px;background:#f1e9e7;border-radius:20px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:#f19bb2;border-radius:20px}.shop-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.shop-row:last-child{border:0}.shop-icon{font-size:30px}.shop-info{flex:1}.shop-info b{display:block;font-size:14px}.shop-info small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#554852;color:white;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}.achievement{background:#fff8e5;border-radius:14px;padding:12px;margin:8px 0;font-size:13px}.achievement.done{background:#e7f7ed}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}@media(min-width:600px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:28px}.hero h1{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">TIME <span>KILLER</span> ✿</div><div class="sub">오늘도 가볍게, 즐겁게!</div></div><div class="profile">🪙 <span id="coins">0</span></div></header>
<main>
<section id="home" class="screen active">
 <div class="hero"><div class="eyebrow">오늘의 작은 즐거움</div><h1>심심할 틈이 없는<br>나만의 게임 놀이터!</h1><p>잠깐 놀다 가도 좋고, 오래 머물러도 좋아요.</p></div>
 <div class="stats"><div class="stat"><b id="level">Lv. 1</b><small>내 레벨</small></div><div class="stat"><b id="plays">0</b><small>플레이 횟수</small></div><div class="stat"><b id="best">-</b><small>최고 기록</small></div></div>
 <div class="section-head"><h2>🎀 바로 시작하기</h2><small>마음에 드는 게임을 골라봐!</small></div>
 <div class="games">
 <button class="game-card" onclick="openGame('2048')"><div class="game-emoji" style="background:#fff0d7">🔢</div><b>숫자 합치기 2048</b><small>숫자를 합쳐 최고 기록에 도전!</small><span class="tag">퍼즐 · 오래 즐기기</span></button>
 <button class="game-card" onclick="openGame('word')"><div class="game-emoji" style="background:#ffe6ef">🔤</div><b>오늘의 단어</b><small>숨겨진 다섯 글자 단어 찾기</small><span class="tag">퀴즈 · 짧게 즐기기</span></button>
 <button class="game-card" onclick="openGame('reaction')"><div class="game-emoji" style="background:#e4f5eb">⚡</div><b>반응 속도</b><small>초록색이 되면 빠르게 터치!</small><span class="tag">아케이드 · 기록 도전</span></button>
 <button class="game-card" onclick="openGame('dungeon')"><div class="game-emoji" style="background:#eee8ff">🗡️</div><b>끝없는 던전</b><small>몬스터를 물리치고 더 깊이!</small><span class="tag">모험 · 성장형</span></button>
 <button class="game-card" onclick="openGame('shop')"><div class="game-emoji" style="background:#e5f0ff">🏪</div><b>방치형 상점</b><small>작은 가게를 멋지게 키워보자</small><span class="tag">방치형 · 누적 성장</span></button>
 </div>
 <div class="section-head"><h2>✨ 빠른 메뉴</h2></div><div class="quick"><button onclick="showTab('achievements')">🏆 업적 확인</button><button onclick="showTab('profile')">📊 내 기록</button><button onclick="showTab('settings')">⚙️ 설정·백업</button></div>
</section>
<section id="play" class="screen"><button class="back" onclick="showTab('home')">← 게임 목록</button><div id="gameArea"></div></section>
<section id="achievements" class="screen"><div class="section-head"><h2>🏆 나의 업적</h2></div><div class="panel" id="achievementList"></div></section>
<section id="profile" class="screen"><div class="section-head"><h2>📊 나의 기록</h2></div><div class="panel" id="profileInfo"></div></section>
<section id="settings" class="screen"><div class="section-head"><h2>⚙️ 설정 및 데이터</h2></div><div class="panel"><p class="muted">진행 상황은 이 브라우저에 자동 저장돼요. 브라우저 데이터 삭제나 기기 변경에 대비해 백업 파일을 보관해 주세요.</p><div class="settings-row"><b>데이터 백업</b><button class="btn" onclick="exportSave()">내보내기</button></div><div class="settings-row"><b>데이터 복원</b><label class="btn secondary">파일 선택<input type="file" accept="application/json" hidden onchange="importSave(event)"></label></div><div class="settings-row"><b>게임 데이터 초기화</b><button class="btn secondary" onclick="resetSave()">초기화</button></div></div></section>
</main>
</div>
<nav class="nav"><div class="nav-inner"><button class="active" data-tab="home" onclick="showTab('home')"><span class="ico">🏠</span>홈</button><button data-tab="play" onclick="showTab('home')"><span class="ico">🎮</span>게임</button><button data-tab="achievements" onclick="showTab('achievements')"><span class="ico">🏆</span>업적</button><button data-tab="profile" onclick="showTab('profile')"><span class="ico">👤</span>기록</button><button data-tab="settings" onclick="showTab('settings')"><span class="ico">⚙️</span>설정</button></div></nav>
<div class="toast" id="toast"></div>
<script>
const KEY='timeKillerSaveV1';
const fresh=()=>({coins:0,xp:0,plays:0,bestReaction:null,best2048:0,dungeon:{floor:1,hp:30,maxHp:30,power:5},shop:{level:1,rate:1,last:Date.now(),total:0},achievements:[],wordWins:0});
let S=load();
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));renderHeader()}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function reward(c=3,x=5){S.coins+=c;S.xp+=x;S.plays++;save();renderStats();checkAchievements()}
function renderHeader(){document.getElementById('coins').textContent=S.coins}
function renderStats(){document.getElementById('level').textContent='Lv. '+(1+Math.floor(S.xp/100));document.getElementById('plays').textContent=S.plays;document.getElementById('best').textContent=S.bestReaction?S.bestReaction+'ms':(S.best2048||'-')}
function showTab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='profile')renderProfile();if(id==='achievements')renderAchievements();if(id==='home')renderStats();window.scrollTo(0,0)}
function openGame(id){showTab('play');let a=document.getElementById('gameArea');({ '2048':game2048,'word':gameWord,'reaction':gameReaction,'dungeon':gameDungeon,'shop':gameShop})[id](a)}
function checkAchievements(){let checks=[['first','첫 발걸음','게임을 처음 플레이하기',S.plays>=1],['ten','게임 마니아','게임 10회 플레이하기',S.plays>=10],['rich','작은 부자','코인 100개 모으기',S.coins>=100],['deep','던전 탐험가','던전 5층 도달하기',S.dungeon.floor>=5],['word','단어 박사','단어 게임 3회 성공하기',S.wordWins>=3]];checks.forEach(c=>{if(c[3]&&!S.achievements.includes(c[0])){S.achievements.push(c[0]);toast('🏆 업적 달성: '+c[1]);S.coins+=10}});save()}
function renderAchievements(){let cs=[['first','첫 발걸음','게임을 처음 플레이하기',S.plays>=1],['ten','게임 마니아','게임 10회 플레이하기',S.plays>=10],['rich','작은 부자','코인 100개 모으기',S.coins>=100],['deep','던전 탐험가','던전 5층 도달하기',S.dungeon.floor>=5],['word','단어 박사','단어 게임 3회 성공하기',S.wordWins>=3]];document.getElementById('achievementList').innerHTML=cs.map(c=>`<div class="achievement ${c[3]?'done':''}">${c[3]?'🏅':'🔒'} <b>${c[1]}</b><br><span class="muted">${c[2]}</span></div>`).join('')}
function renderProfile(){document.getElementById('profileInfo').innerHTML=`<div class="stats"><div class="stat"><b>${1+Math.floor(S.xp/100)}</b><small>레벨</small></div><div class="stat"><b>${S.plays}</b><small>플레이</small></div><div class="stat"><b>${S.coins}</b><small>코인</small></div></div><p>누적 경험치: <b>${S.xp} XP</b></p><p>최고 2048 점수: <b>${S.best2048}</b></p><p>최고 반응 속도: <b>${S.bestReaction?S.bestReaction+'ms':'기록 없음'}</b></p><p>던전 최고 층: <b>${S.dungeon.floor}층</b></p><p>상점 누적 수익: <b>${S.shop.total} 코인</b></p>`}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='time-killer-backup.json';a.click();URL.revokeObjectURL(u);toast('백업 파일을 만들었어요!')}
function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(typeof d.coins!=='number'||!d.dungeon)throw 0;S={...fresh(),...d};save();renderStats();toast('데이터를 복원했어요!')}catch{toast('올바른 백업 파일이 아니에요.')}};r.readAsText(f)}
function resetSave(){if(confirm('모든 게임 기록과 진행 상황을 초기화할까요?')){S=fresh();save();renderStats();toast('초기화했어요.')}}
function game2048(a){let board=Array(16).fill(0),score=0;function spawn(){let z=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)board[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}spawn();spawn();function draw(){a.innerHTML=`<div class="game-title">🔢 숫자 합치기 2048</div><p class="muted">같은 숫자를 합쳐 2048에 도전해 봐!</p><div class="center">점수 <b>${score}</b></div><div class="grid2048">${board.map(v=>`<div class="cell ${v?'v'+Math.min(v,2048):''}">${v||''}</div>`).join('')}</div><div class="center muted">화면을 밀거나 아래 버튼을 눌러 이동</div><div class="center" style="margin:12px"><button class="btn secondary" onclick="window.mv2048('up')">↑</button><div style="margin:6px"><button class="btn secondary" onclick="window.mv2048('left')">←</button> <button class="btn secondary" onclick="window.mv2048('down')">↓</button> <button class="btn secondary" onclick="window.mv2048('right')">→</button></div><button class="btn" onclick="openGame('2048')">새 게임</button></div>`}
window.mv2048=(dir)=>{let changed=false;for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=n;c=k}else if(dir==='right'){r=n;c=3-k}else if(dir==='up'){r=k;c=n}else{r=3-k;c=n}ids.push(r*4+c)}let vals=ids.map(i=>board[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++;}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,j)=>{if(board[id]!==out[j])changed=true;board[id]=out[j]})}if(changed){spawn();S.best2048=Math.max(S.best2048,score);save();draw();if(board.includes(2048)){reward(25,30);toast('2048 달성! 대단해!')}else if(!board.some(v=>!v)){toast('게임 종료! 새 게임을 시작해 봐.');reward(2,2)}}};draw();a.onkeydown=e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key])window.mv2048(m[e.key])}}
function gameWord(a){let words=['사과나무','무지개빛','고양이별','바다소리','초코우유','달빛산책','종이비행'];let answer=words[Math.floor(Math.random()*words.length)],tries=0,history=[];a.innerHTML=`<div class="game-title">🔤 오늘의 단어</div><p class="muted">정답은 4~5글자 단어야. 글자를 입력해 맞혀 봐!</p><div id="wordHistory" class="center"></div><input id="guess" class="field" maxlength="5" placeholder="단어를 입력해 줘"><button class="btn" id="guessBtn">확인하기</button><p class="muted">힌트: 정답에 포함된 글자는 🟨, 위치까지 맞으면 🟩</p>`;let input=a.querySelector('#guess');function submit(){let g=input.value.trim();if(g.length!==answer.length){toast(answer.length+'글자로 입력해 줘!');return}tries++;let row=document.createElement('div');row.className='word-row';[...g].forEach((ch,i)=>{let d=document.createElement('div');d.className='letter';d.textContent=ch;d.style.background=answer[i]===ch?'#c9efd9':answer.includes(ch)?'#fff0b8':'#eee';row.appendChild(d)});a.querySelector('#wordHistory').appendChild(row);input.value='';if(g===answer){toast('정답이야! 🎉');S.wordWins++;reward(12,15);a.querySelector('#guessBtn').disabled=true}else if(tries>=6){toast('정답은 '+answer+'였어!');reward(2,3);a.querySelector('#guessBtn').disabled=true}}a.querySelector('#guessBtn').onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}
let reactionTimer=null;
function gameReaction(a){let state='ready',start=0,timer; a.innerHTML=`<div class="game-title">⚡ 반응 속도 테스트</div><p class="muted">시작을 누르고 화면이 초록색으로 바뀌면 재빨리 터치!</p><button id="reactPad" class="panel center" style="width:100%;height:220px;background:#fff0f3;font-size:23px;font-weight:900">시작하기</button><p class="center muted" id="reactResult">너의 반응 속도는?</p>`;let pad=a.querySelector('#reactPad'),res=a.querySelector('#reactResult');pad.onclick=()=>{if(state==='ready'){state='wait';pad.style.background='#ffe8bb';pad.textContent='초록색을 기다려!';timer=setTimeout(()=>{state='go';start=performance.now();pad.style.background='#bdeed1';pad.textContent='지금 터치!'},1000+Math.random()*3000)}else if(state==='wait'){clearTimeout(timer);state='ready';pad.textContent='너무 빨랐어! 다시 시작';pad.style.background='#fff0f3'}else if(state==='go'){let ms=Math.round(performance.now()-start);state='ready';pad.style.background='#fff0f3';pad.textContent='다시 도전하기';res.textContent='반응 속도: '+ms+'ms';S.bestReaction=S.bestReaction?Math.min(S.bestReaction,ms):ms;reward(ms<300?12:5,8);save();renderStats()}}}
function gameDungeon(a){function draw(){let d=S.dungeon,enemyHp=10+d.floor*5;a.innerHTML=`<div class="game-title">🗡️ 끝없는 던전</div><p class="muted">층을 오를수록 몬스터가 강해져. 장비를 강화하고 더 깊이 탐험해 봐!</p><div class="dungeon"><div class="muted">현재 ${d.floor}층</div><div class="monster">${['👾','🐉','🧌','👻','🐲'][(d.floor-1)%5]}</div><b>던전 몬스터</b><p>몬스터 체력: ${enemyHp}</p><div class="bar"><i style="width:${Math.max(5,100*d.hp/d.maxHp)}%"></i></div><small>내 체력 ${d.hp}/${d.maxHp} · 공격력 ${d.power}</small></div><div class="panel"><button class="btn" id="attack">⚔️ 공격하기</button> <button class="btn secondary" id="heal">💖 회복 (10코인)</button><p class="muted">몬스터를 쓰러뜨리면 코인과 다음 층이 열려!</p></div>`;a.querySelector('#attack').onclick=()=>{let dmg=d.power+Math.floor(Math.random()*5);let enemy=enemyHp-dmg;if(enemy<=0){d.floor++;d.hp=Math.min(d.maxHp,d.hp+8);S.coins+=15;S.xp+=12;toast('층 돌파! 코인 15개 획득!')}else{d.hp-=Math.ceil(enemyHp/4);if(d.hp<=0){d.hp=d.maxHp;d.floor=Math.max(1,d.floor-1);toast('쓰러졌어! 한 층 내려가고 회복했어.')}}save();checkAchievements();draw()};a.querySelector('#heal').onclick=()=>{if(S.coins<10){toast('코인이 부족해!');return}S.coins-=10;d.hp=d.maxHp;save();draw()}}draw()}
function gameShop(a){let sh=S.shop;function collect(){let now=Date.now(),earned=Math.floor((now-sh.last)/1000*sh.rate);if(earned>0){S.coins+=earned;sh.total+=earned;sh.last=now;save()}}collect();function draw(){let sh=S.shop;a.innerHTML=`<div class="game-title">🏪 방치형 상점</div><p class="muted">가게를 운영하고 업그레이드해서 자동 수익을 늘려 봐!</p><div class="panel center"><div style="font-size:60px">🏡</div><b>나의 작은 상점 Lv.${sh.level}</b><div class="big">🪙 ${S.coins}</div><p class="muted">초당 ${sh.rate} 코인 · 누적 수익 ${sh.total}</p><button class="btn" id="collect">수익 받기</button></div><div class="panel"><div class="shop-row"><div class="shop-icon">🪴</div><div class="shop-info"><b>가게 꾸미기</b><small>레벨 +1 · 초당 수익 +1</small></div><button class="btn secondary" id="upgrade">🪙 ${sh.level*25}</button></div><div class="shop-row"><div class="shop-icon">🧁</div><div class="shop-info"><b>인기 상품 추가</b><small>초당 수익 +3</small></div><button class="btn secondary" id="product">🪙 100</button></div></div>`;a.querySelector('#collect').onclick=()=>{collect();reward(1,2);draw()};a.querySelector('#upgrade').onclick=()=>{let cost=sh.level*25;if(S.coins<cost){toast('코인이 부족해!');return}S.coins-=cost;sh.level++;sh.rate++;save();draw()};a.querySelector('#product').onclick=()=>{if(S.coins<100){toast('코인이 부족해!');return}S.coins-=100;sh.rate+=3;save();draw()}}draw();let int=setInterval(()=>{if(document.getElementById('gameArea')?.contains(a)){collect();let p=a.querySelector('.big');if(p)p.textContent='🪙 '+S.coins}else clearInterval(int)},3000)}
renderHeader();renderStats();
</script>
</body></html>
